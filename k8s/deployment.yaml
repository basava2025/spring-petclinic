apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: basavab413/petclinic-app:v1
        ports:
        - containerPort: 8080

        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"

        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms128m"

        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://demo-db:3306/petclinic
        - name: SPRING_DATASOURCE_USERNAME
          value: root
        - name: SPRING_DATASOURCE_PASSWORD
          value: root
